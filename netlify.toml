[build]
  # Build command for Next.js
  command = "npm run build"
  # Next.js plugin handles publish directory automatically
  # If not using plugin, publish = ".next"

# Netlify Configuration
# This file is used when deploying from personal repo's 'main' branch
# The main branch is auto-synced from geowise repo's master/dev branches

[context.production]
  # Main branch (synced from geowise master/dev)
  branch = "main"
  command = "npm run build"

# Environment variables should be configured in Netlify dashboard
# for the netlify branch context
# [context.production.environment]
#   NEXT_PUBLIC_API_URL = "https://gw5cn.geowise.ai"
#   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY = "your_key_here"
