[build]
  command = "npm run build"
  # Publish dir set by @netlify/plugin-nextjs

# --- API: Direct to backend (no Netlify proxy) ---
# Client-side: axios uses NEXT_PUBLIC_DEV_API_URL → https://gw5cndev.geowise.ai directly.
# No /api proxy, no Netlify Functions for API. Saves Functions usage and latency.
# Set in Netlify: Environment variables → NEXT_PUBLIC_DEV_API_URL = https://gw5cndev.geowise.ai

[context.production]
  branch = "main"
  command = "npm run build"

# Environment variables (in Netlify UI): NEXT_PUBLIC_DEV_API_URL, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
