name: CI - Build & Type Check

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_DEV_API_URL: ${{ secrets.NEXT_PUBLIC_DEV_API_URL }}
          # Add other necessary build env vars here

      - name: Deployment Notification
        if: success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
        run: |
          echo "Build successful. Triggering deployment notification..."
          # Here we would call a Slack Webhook if configured
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"🚀 Deployment to ${{ github.ref_name }} successful!"}' ${{ secrets.SLACK_WEBHOOK }}
